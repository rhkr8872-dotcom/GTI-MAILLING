name: run-gti

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"   # 한국시간 매일 06:00

jobs:
  run-gti:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      GTI_SEND_EMAIL: "Y"
      GTI_SMTP_HOST: ${{ secrets.GTI_SMTP_HOST }}
      GTI_SMTP_PORT: ${{ secrets.GTI_SMTP_PORT }}
      GTI_SMTP_USER: ${{ secrets.GTI_SMTP_USER }}
      GTI_SMTP_PASS: ${{ secrets.GTI_SMTP_PASS }}
      GTI_MAIL_TO: ${{ secrets.GTI_MAIL_TO }}

      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show repository files
        run: |
          pwd
          echo "===== FILE LIST ====="
          find . -maxdepth 3 -type f | sort

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare folders
        run: |
          mkdir -p data output

      - name: Run STEP1 site crawler
        run: python "1.site_crawler.py"

      - name: Run STEP2-1 Naver collector
        run: python "2-1.naver_news_collector.py"

      - name: Run STEP2-2 Google collector
        run: python "2-2.google_news_collector.py"

      - name: Run STEP2-3 RSS collector
        run: python "2-3.rss_news_collector.py"

      - name: Show output after collectors
        if: always()
        run: |
          echo "===== OUTPUT AFTER STEP1/2 ====="
          ls -la output || true
          find output -maxdepth 1 -type f | sort || true

      - name: Run STEP3 merge
        run: python "3.merge_news.py"

      - name: Show output after STEP3
        if: always()
        run: |
          echo "===== OUTPUT AFTER STEP3 ====="
          ls -la output || true
          find output -maxdepth 1 -type f | sort || true

      - name: Run STEP4 AI analyzer
        run: |
          if [ -f "4.news_ai_analyzer.py" ]; then
            python "4.news_ai_analyzer.py"
          else
            echo "STEP4 file not found. Skip STEP4."
          fi

      - name: Check STEP5 input
        run: |
          echo "===== OUTPUT BEFORE STEP5 ====="
          ls -la output || true
          find output -maxdepth 1 -type f | sort || true

          if [ ! -f "output/3.news_ai_summary.xlsx" ] && \
             [ ! -f "output/news_ai_summary.xlsx" ] && \
             [ ! -f "output/4.news_raw.xlsx" ] && \
             [ ! -f "output/news_raw.xlsx" ]; then
            echo "❌ STEP5 입력파일 없음"
            exit 1
          fi

      - name: Run STEP5 mail engine
        run: python "5.GTI Mail Engine.py"

      - name: Show final output files
        if: always()
        run: |
          echo "===== FINAL OUTPUT FILES ====="
          ls -la output || true
          find output -maxdepth 2 -type f | sort || true

      - name: Upload result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTI-result
          path: |
            output/**
          if-no-files-found: warn

name: GTI Daily Mail

on:
  schedule:
    # 06:00 KST = 21:00 UTC (previous day)
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  run-gti:
    runs-on: ubuntu-latest

    env:
      GTI_SEND_EMAIL: "Y"
      GTI_SMTP_USER: ${{ secrets.GTI_SMTP_USER }}
      GTI_SMTP_PASS: ${{ secrets.GTI_SMTP_PASS }}
      GTI_MAIL_TO: ${{ secrets.GTI_MAIL_TO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - run: python "1.site_news_collector.py"
      - run: python "2-1.naver_news_collector.py"
      - run: python "2-2.google_news_collector.py"
      - run: python "2-3.rss_news_collector.py"
      - run: python "3.merge_news.py"
      - run: python "5.GTI Mail Engine.py"

      - uses: actions/upload-artifact@v4
        with:
          name: GTI-result
          path: output/*

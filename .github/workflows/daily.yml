name: run-gti

on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *" # Korea 06:00

jobs:
  run-gti:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GTI_SEND_EMAIL: "Y"
      GTI_SMTP_HOST: ${{ secrets.GTI_SMTP_HOST }}
      GTI_SMTP_PORT: ${{ secrets.GTI_SMTP_PORT }}
      GTI_SMTP_USER: ${{ secrets.GTI_SMTP_USER }}
      GTI_SMTP_PASS: ${{ secrets.GTI_SMTP_PASS }}
      GTI_MAIL_TO: ${{ secrets.GTI_MAIL_TO }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show repository files
        run: |
          pwd
          echo "===== FILE LIST ====="
          find . -maxdepth 3 -type f | sort

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare folders
        run: |
          mkdir -p data output

      - name: Run STEP1
        run: |
          if [ -f "1.site_crawler.py" ]; then
            python "1.site_crawler.py"
          elif [ -f "1.site_news_collector.py" ]; then
            python "1.site_news_collector.py"
          else
            echo "❌ STEP1 파일 없음"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

      - name: Run STEP2-1 Naver
        run: |
          if [ -f "2-1.naver_news_collector.py" ]; then
            python "2-1.naver_news_collector.py"
          else
            echo "STEP2-1 skip"
          fi

      - name: Run STEP2-2 Google
        run: |
          if [ -f "2-2.google_news_collector.py" ]; then
            python "2-2.google_news_collector.py"
          else
            echo "STEP2-2 skip"
          fi

      - name: Run STEP2-3 RSS
        run: |
          if [ -f "2-3.rss_news_collector.py" ]; then
            python "2-3.rss_news_collector.py"
          else
            echo "STEP2-3 skip"
          fi

      - name: Show output after STEP1-2
        if: always()
        run: |
          echo "===== OUTPUT AFTER STEP1-2 ====="
          ls -la output || true
          find output -maxdepth 1 -type f | sort || true

      - name: Run STEP3
        run: |
          if [ -f "3.merge_news.py" ]; then
            python "3.merge_news.py"
          else
            echo "❌ STEP3 파일 없음"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

      - name: Check STEP3 result
        run: |
          echo "===== OUTPUT BEFORE STEP5 ====="
          ls -la output || true
          find output -maxdepth 1 -type f | sort || true

          if [ ! -f "output/3.news_ai_summary.xlsx" ] && \
             [ ! -f "output/news_ai_summary.xlsx" ] && \
             [ ! -f "output/4.news_raw.xlsx" ] && \
             [ ! -f "output/news_raw.xlsx" ]; then
            echo "❌ STEP5 입력파일 없음"
            echo "STEP3가 news_ai_summary.xlsx 또는 news_raw.xlsx를 만들지 못했습니다."
            exit 1
          fi

      - name: Run STEP5
        run: |
          if [ -f "5.GTI Mail Engine.py" ]; then
            python "5.GTI Mail Engine.py"
          else
            echo "❌ STEP5 파일 없음"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

      - name: Show final output files
        if: always()
        run: |
          echo "===== FINAL OUTPUT FILES ====="
          ls -la output || true
          find output -maxdepth 2 -type f | sort || true

      - name: Upload result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTI-result
          path: |
            output/**
          if-no-files-found: warn

name: GTI Daily Mail

on:
  schedule:
    # 06:00 KST = 21:00 UTC (previous day)
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  run-gti:
    runs-on: ubuntu-latest

    env:
      GTI_SEND_EMAIL: "Y"
      GTI_SMTP_USER: ${{ secrets.GTI_SMTP_USER }}
      GTI_SMTP_PASS: ${{ secrets.GTI_SMTP_PASS }}
      GTI_MAIL_TO: ${{ secrets.GTI_MAIL_TO }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run STEP1 site collector
        run: python "1.site_news_collector.py"

      - name: Run STEP2-1 Naver collector
        run: python "2-1.naver_news_collector.py"

      - name: Run STEP2-2 Google collector
        run: python "2-2.google_news_collector.py"

      - name: Run STEP2-3 RSS collector
        run: python "2-3.rss_news_collector.py"

      - name: Run STEP3 merge
        run: python "3.merge_news.py"

      - name: Run STEP5 mail engine
        run: python "5.GTI Mail Engine.py"

      - name: Upload result files
        uses: actions/upload-artifact@v4
        with:
          name: GTI-Radar-Results
          path: |
            output/*.xlsx
            output/*.html

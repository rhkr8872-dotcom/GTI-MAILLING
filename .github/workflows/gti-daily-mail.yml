name: GTI Daily Mail

on:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # Node.js 24 강제 환경 변수는 액션 버전 업데이트로 더 이상 필요하지 않으나 원본 유지를 위해 남겨둡니다.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  gti-mail:
    runs-on: windows-latest

    permissions:
      contents: read

    env:
      GTI_BASE_DIR: C:\temp
      GTI_OUTPUT_DIR: outputs
      GTI_LOOKBACK_HOURS: "24"
      GTI_MAX_PER_SOURCE: "50"

      GTI_SEND_EMAIL: ${{ secrets.GTI_SEND_EMAIL }}
      GTI_SMTP_HOST: ${{ secrets.GTI_SMTP_HOST }}
      GTI_SMTP_PORT: ${{ secrets.GTI_SMTP_PORT }}
      GTI_SMTP_USER: ${{ secrets.GTI_SMTP_USER }}
      GTI_SMTP_PASS: ${{ secrets.GTI_SMTP_PASS }}
      GTI_MAIL_TO: ${{ secrets.GTI_MAIL_TO }}

      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      NEWS_API: ${{ secrets.NEWS_API }}
      NEWS_KEY: ${{ secrets.NEWS_KEY }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # 🔄 v4 -> v6 업데이트 (Node 24 내장 지원)

      - name: Set up Python
        uses: actions/setup-python@v6 # 🔄 v5 -> v6 업데이트 (Node 24 내장 지원)
        with:
          python-version: "3.12"

      - name: Create folders
        shell: cmd
        run: |
          if not exist C:\temp mkdir C:\temp
          if not exist C:\temp\logs mkdir C:\temp\logs
          if not exist C:\temp\archive mkdir C:\temp\archive
          if not exist outputs mkdir outputs
          if not exist outputs\logs mkdir outputs\logs
          if not exist outputs\archive mkdir outputs\archive

      - name: Copy GTI Files
        shell: cmd
        run: |
          copy *.py C:\temp\
          if exist *.xlsx copy *.xlsx C:\temp\
          if exist *.csv copy *.csv C:\temp\
          if exist *.json copy *.json C:\temp\
          if exist *.txt copy *.txt C:\temp\

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show Files
        shell: cmd
        run: |
          echo ===== Repository Files =====
          dir
          echo ===== C:\temp Files =====
          dir C:\temp

      - name: RUN GTI PIPELINE
        shell: cmd
        run: |
          python C:\temp\7.run_gti_pipeline.py > outputs\pipeline_console.log 2>&1
          type outputs\pipeline_console.log

      - name: Copy results to outputs
        if: always()
        shell: cmd
        run: |
          if exist C:\temp\logs xcopy C:\temp\logs outputs\logs\ /E /I /Y
          if exist C:\temp\archive xcopy C:\temp\archive outputs\archive\ /E /I /Y
          if exist C:\temp\*.xlsx copy C:\temp\*.xlsx outputs\
          if exist C:\temp\*.html copy C:\temp\*.html outputs\
          if exist C:\temp\*.log copy C:\temp\*.log outputs\logs\

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v7 # 🔄 v4 -> v7 업데이트 (Node 24 내장 지원)
        with:
          name: gti-radar-output
          path: outputs

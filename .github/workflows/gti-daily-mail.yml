name: GTI Daily Mail

on:
  schedule:
    - cron: "0 21 * * *"
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gti-mail:
    runs-on: windows-latest

    permissions:
      contents: read

    env:
      GTI_BASE_DIR: C:\temp
      GTI_OUTPUT_DIR: outputs
      GTI_LOOKBACK_HOURS: "24"
      GTI_MAX_PER_SOURCE: "50"

      GTI_SEND_EMAIL: ${{ secrets.GTI_SEND_EMAIL }}
      GTI_SMTP_HOST: ${{ secrets.GTI_SMTP_HOST }}
      GTI_SMTP_PORT: ${{ secrets.GTI_SMTP_PORT }}
      GTI_SMTP_USER: ${{ secrets.GTI_SMTP_USER }}
      GTI_SMTP_PASS: ${{ secrets.GTI_SMTP_PASS }}
      GTI_MAIL_TO: ${{ secrets.GTI_MAIL_TO }}

      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      NEWS_API: ${{ secrets.NEWS_API }}
      NEWS_KEY: ${{ secrets.NEWS_KEY }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create folders
        shell: cmd
        run: |
          if not exist C:\temp mkdir C:\temp
          if not exist C:\temp\logs mkdir C:\temp\logs
          if not exist C:\temp\archive mkdir C:\temp\archive
          if not exist outputs mkdir outputs

      - name: Copy Python Files
        shell: cmd
        run: |
          copy *.py C:\temp\

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show Files
        shell: cmd
        run: |
          dir
          echo ======================
          dir C:\temp

      - name: RUN GTI PIPELINE
        shell: cmd
        run: |
          python C:\temp\7.run_gti_pipeline.py

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gti-radar-output
          path: |
            outputs
            C:\temp\logs
            C:\temp\archive

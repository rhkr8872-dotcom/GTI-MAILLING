name: GTI Daily Mail

on:
  schedule:
    # 06:00 KST = 21:00 UTC on the previous day
    - cron: "0 21 * * *"
  workflow_dispatch:
on:
  # 기존에 있던 push나 schedule 설정
  push:
    branches: [ "main" ]
  
  # 수동 실행 버튼을 활성화하는 코드 (아무 옵션을 적지 않아도 됩니다)
  workflow_dispatch: 

jobs:

jobs:
  gti-mail:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GTI_BASE_DIR: data
      GTI_OUTPUT_DIR: outputs
      GTI_LOOKBACK_HOURS: "24"
      GTI_MAX_PER_SOURCE: "50"
      GTI_SEND_EMAIL: ${{ secrets.GTI_SEND_EMAIL }}
      GTI_SMTP_HOST: ${{ secrets.GTI_SMTP_HOST }}
      GTI_SMTP_PORT: ${{ secrets.GTI_SMTP_PORT }}
      GTI_SMTP_USER: ${{ secrets.GTI_SMTP_USER }}
      GTI_SMTP_PASS: ${{ secrets.GTI_SMTP_PASS }}
      GTI_MAIL_TO: ${{ secrets.GTI_MAIL_TO }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      NEWS_API: ${{ secrets.NEWS_API }}
      NEWS_KEY: ${{ secrets.NEWS_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: RUN GTI PIPELINE
        run: python 7.run_gti_pipeline.py

        uses: actions/upload-artifact@v4
        with:
          name: gti-radar-output
          path: outputs/
          name: RUN GTI PIPELINE
          run: python 7.run_gti_pipeline.py
```

